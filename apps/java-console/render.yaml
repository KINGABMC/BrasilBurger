services:
  - type: worker
    name: brasil-burger-java-console
    env: java
    region: frankfurt
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/java-console-1.0-SNAPSHOT.jar
    envVars:
      - key: NEONDB_CONNECTION_STRING
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx256m"